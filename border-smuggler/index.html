<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>Border Smuggler</title>
<style>
  @font-face { font-family: Vazir; font-weight: 900; src: url(assets/Vazirmatn-Black.ttf); }
  @font-face { font-family: Vazir; font-weight: 800; src: url(assets/Vazirmatn-ExtraBold.ttf); }
  @font-face { font-family: Vazir; font-weight: 700; src: url(assets/Vazirmatn-Bold.ttf); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 540px; height: 960px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* «چیزی که جلوی چشم بود» — motion graphic, 1080x1920, deterministic.
   window.renderFrame(t) draws the frame at time t (seconds).
   Optional photo backgrounds: put assets/bg-border.jpg and/or
   assets/bg-village.jpg (1620x2400, ground line around y=1460+240) and
   they replace the procedurally painted backgrounds. */
const W = 1080, H = 1920, DURATION = 43.0;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const OUT = '#1b1b1f';
const GY = 1760;              // ground line for characters (world y)
const BK = 1.15;              // bike scale

// ------------------------------------------------------------ utilities
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function vnoise(x, seed) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i + seed * 1000), hash(i + 1 + seed * 1000), u); }
function fbm(x, seed, oct = 5) { let s = 0, a = .5, f = 1; for (let o = 0; o < oct; o++) { s += a * vnoise(x * f, seed + o); a *= .5; f *= 2.03; } return s; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mixHex(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function fillOut(g, fill, lw = 5) { g.fillStyle = fill; g.fill(); g.lineWidth = lw; g.strokeStyle = OUT; g.lineJoin = 'round'; g.stroke(); }

// ------------------------------------------------------------ backgrounds
const WX0 = -270, WY0 = -240, WW = 1620, WH = 2400, BS = 1.5;
const BG = {};

function paintSkyAndLand(g, rnd) {
  const HOR = 1190;
  let gr = g.createLinearGradient(0, WY0, 0, HOR + 60);
  gr.addColorStop(0, '#1d2533'); gr.addColorStop(.35, '#3a4559'); gr.addColorStop(.62, '#7c7a8c');
  gr.addColorStop(.82, '#c99f8c'); gr.addColorStop(.94, '#eec29c'); gr.addColorStop(1, '#f4d3ae');
  g.fillStyle = gr; g.fillRect(WX0, WY0, WW, HOR + 80 - WY0);
  // sun glow
  gr = g.createRadialGradient(760, 1120, 10, 760, 1120, 820);
  gr.addColorStop(0, 'rgba(255,226,180,.85)'); gr.addColorStop(.25, 'rgba(255,196,150,.35)'); gr.addColorStop(1, 'rgba(255,190,150,0)');
  g.fillStyle = gr; g.fillRect(WX0, WY0, WW, HOR + 80 - WY0);
  // clouds (two passes: dark bodies, warm lit undersides)
  const cl = mk(WW / 2, 1300 / 2), cg = cl.getContext('2d');
  cg.scale(.5, .5); cg.translate(-WX0, -WY0);
  for (let i = 0; i < 170; i++) {
    const y = WY0 + 60 + Math.pow(rnd(), 1.3) * 1050, x = WX0 + rnd() * WW;
    const rx = 90 + rnd() * 300, ry = 22 + rnd() * 60, nearH = clamp((y - 300) / 700);
    cg.fillStyle = `rgba(${lerp(45, 120, nearH) | 0},${lerp(52, 110, nearH) | 0},${lerp(68, 125, nearH) | 0},${.18 + rnd() * .25})`;
    cg.beginPath(); cg.ellipse(x, y, rx, ry, 0, 0, 7); cg.fill();
    if (rnd() < .7) {
      cg.fillStyle = `rgba(250,${180 + rnd() * 40 | 0},${130 + rnd() * 40 | 0},${.08 + nearH * .22})`;
      cg.beginPath(); cg.ellipse(x + rx * .1, y + ry * .55, rx * .8, ry * .45, 0, 0, 7); cg.fill();
    }
  }
  g.save(); g.filter = 'blur(14px)'; g.drawImage(cl, WX0, WY0, WW, 1300); g.restore();
  // mountain layers with aerial perspective
  const layers = [
    { base: 1035, amp: 170, col: '#9d93a0', blur: 3, seed: 3, sc: .0028 },
    { base: 1110, amp: 120, col: '#7d7686', blur: 2, seed: 7, sc: .0045 },
    { base: 1175, amp: 60, col: '#5d5c66', blur: 1.2, seed: 11, sc: .007 },
  ];
  layers.forEach((L, li) => {
    g.save(); g.filter = `blur(${L.blur}px)`;
    g.beginPath(); g.moveTo(WX0, 1500);
    for (let x = WX0; x <= WX0 + WW; x += 6) g.lineTo(x, L.base - fbm(x * L.sc, L.seed) * L.amp * 2 + L.amp * .6);
    g.lineTo(WX0 + WW, 1500); g.closePath();
    const mg = g.createLinearGradient(0, L.base - L.amp * 1.5, 0, L.base + 200);
    mg.addColorStop(0, L.col); mg.addColorStop(1, mixHex(L.col, '#e9c8b0', .45));
    g.fillStyle = mg; g.fill(); g.restore();
    // haze band after each layer
    const hz = g.createLinearGradient(0, L.base - 60, 0, L.base + 120);
    hz.addColorStop(0, 'rgba(240,215,200,0)'); hz.addColorStop(.6, `rgba(240,215,200,${.35 - li * .07})`); hz.addColorStop(1, 'rgba(240,215,200,0)');
    g.fillStyle = hz; g.fillRect(WX0, L.base - 60, WW, 180);
  });
  // pine/poplar silhouettes
  g.save(); g.filter = 'blur(1.4px)';
  for (let i = 0; i < 70; i++) {
    const x = WX0 + rnd() * WW, base = 1215 + rnd() * 60, h = 70 + rnd() * 130, w = 18 + rnd() * 26;
    g.fillStyle = `rgba(${52 + rnd() * 20 | 0},${62 + rnd() * 18 | 0},${60 + rnd() * 15 | 0},${.75 + rnd() * .25})`;
    g.beginPath(); g.moveTo(x, base - h);
    for (let k = 0; k <= 6; k++) { const yy = base - h + h * k / 6, ww = w * (k / 6) * (k % 2 ? .75 : 1); g.lineTo(x + ww, yy); }
    for (let k = 6; k >= 0; k--) { const yy = base - h + h * k / 6, ww = w * (k / 6) * (k % 2 ? .75 : 1); g.lineTo(x - ww, yy); }
    g.fill();
  }
  g.restore();
  // ground
  gr = g.createLinearGradient(0, 1240, 0, WY0 + WH);
  gr.addColorStop(0, '#8a7f72'); gr.addColorStop(.2, '#6d655c'); gr.addColorStop(.55, '#4e4b47'); gr.addColorStop(1, '#2f2e2d');
  g.fillStyle = gr; g.fillRect(WX0, 1240, WW, WY0 + WH - 1240);
  // morning fog sitting on the ground line
  gr = g.createLinearGradient(0, 1150, 0, 1420);
  gr.addColorStop(0, 'rgba(235,215,205,0)'); gr.addColorStop(.5, 'rgba(235,215,205,.55)'); gr.addColorStop(1, 'rgba(235,215,205,0)');
  g.fillStyle = gr; g.fillRect(WX0, 1150, WW, 270);
}

function paintRoad(g, rnd) {
  // asphalt band (side-on road), lighter & wetter toward the horizon
  let gr = g.createLinearGradient(0, 1455, 0, WY0 + WH);
  gr.addColorStop(0, '#77716b'); gr.addColorStop(.3, '#55524f'); gr.addColorStop(1, '#2a2a2b');
  g.fillStyle = gr; g.fillRect(WX0, 1455, WW, WY0 + WH - 1455);
  // curb
  g.fillStyle = '#9a948b'; g.fillRect(WX0, 1448, WW, 12);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(WX0, 1460, WW, 8);
  // wet sheen: sky reflection
  gr = g.createRadialGradient(760, 1500, 20, 760, 1700, 700);
  gr.addColorStop(0, 'rgba(255,214,170,.38)'); gr.addColorStop(1, 'rgba(255,214,170,0)');
  g.fillStyle = gr; g.fillRect(WX0, 1460, WW, 900);
  // puddles
  for (let i = 0; i < 9; i++) {
    const x = WX0 + 100 + rnd() * (WW - 200), y = 1540 + rnd() * 560, rx = 60 + rnd() * 160, ry = rx * (.08 + y / 2160 * .1);
    const pg = g.createLinearGradient(0, y - ry, 0, y + ry);
    pg.addColorStop(0, 'rgba(240,200,170,.35)'); pg.addColorStop(1, 'rgba(90,95,110,.25)');
    g.fillStyle = pg; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); g.fill();
  }
  // dashed lane line in front of the actors
  g.fillStyle = 'rgba(225,220,205,.55)';
  for (let x = WX0; x < WX0 + WW; x += 190) { g.beginPath(); g.moveTo(x, 1912); g.lineTo(x + 110, 1912); g.lineTo(x + 116, 1932); g.lineTo(x - 6, 1932); g.fill(); }
  // grain / aggregate
  for (let i = 0; i < 26000; i++) {
    const x = WX0 + rnd() * WW, y = 1460 + rnd() * (WY0 + WH - 1460), v = rnd();
    g.fillStyle = v < .5 ? `rgba(0,0,0,${.05 + rnd() * .12})` : `rgba(255,245,230,${.03 + rnd() * .07})`;
    const s = 1 + (y - 1460) / 500;
    g.fillRect(x, y, s * (1 + rnd()), s * (1 + rnd()));
  }
}

function lamp(g, x, base, top) {
  g.fillStyle = '#2b2c30'; g.fillRect(x - 6, top, 12, base - top);
  g.fillRect(x - 6, top, 60, 8);
  g.fillStyle = '#3a3b40'; rr(g, x + 34, top + 4, 40, 20, 6); g.fill();
  const gr = g.createRadialGradient(x + 54, top + 26, 2, x + 54, top + 26, 160);
  gr.addColorStop(0, 'rgba(255,220,160,.9)'); gr.addColorStop(.15, 'rgba(255,205,140,.35)'); gr.addColorStop(1, 'rgba(255,205,140,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(x + 54, top + 26, 160, 0, 7); g.fill();
}

function paintBorderProps(g, rnd) {
  // chain-link fence with barbed wire along the back of the road
  const fTop = 1290, fBase = 1452;
  const fence = (x0, x1) => {
    g.save(); g.filter = 'blur(.8px)';
    g.strokeStyle = 'rgba(70,72,78,.45)'; g.lineWidth = 1.5;
    for (let x = x0; x < x1; x += 14) { g.beginPath(); g.moveTo(x, fTop); g.lineTo(x + 40, fBase); g.stroke(); g.beginPath(); g.moveTo(x + 40, fTop); g.lineTo(x, fBase); g.stroke(); }
    g.fillStyle = '#3c3e44';
    for (let x = x0; x <= x1; x += 120) { g.fillRect(x - 4, fTop - 30, 8, fBase - fTop + 30); }
    g.strokeStyle = '#3c3e44'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(x0, fTop); g.lineTo(x1, fTop); g.stroke();
    g.lineWidth = 1.6;
    for (let x = x0; x < x1; x += 22) { g.beginPath(); g.ellipse(x, fTop - 18, 14, 14, 0, 0, 7); g.stroke(); }
    g.restore();
  };
  fence(WX0, 710); fence(1020, WX0 + WW);
  // bushes at fence base
  for (let i = 0; i < 40; i++) {
    const x = WX0 + rnd() * WW, y = 1440 + rnd() * 14, r = 14 + rnd() * 26;
    g.fillStyle = `rgba(${48 + rnd() * 25 | 0},${62 + rnd() * 25 | 0},${44 + rnd() * 15 | 0},.9)`;
    g.beginPath(); g.arc(x, y - r * .4, r, Math.PI, 0); g.fill();
  }
  lamp(g, 90, 1452, 1030); lamp(g, 1240, 1452, 1050);
  // guard booth
  const bx = 760, bw = 230, bt = 1185, bb = 1455;
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(bx + bw / 2, bb + 6, bw * .7, 14, 0, 0, 7); g.fill();
  let gr = g.createLinearGradient(bx, 0, bx + bw, 0);
  gr.addColorStop(0, '#d8d0c2'); gr.addColorStop(1, '#a9a092');
  g.fillStyle = gr; g.fillRect(bx, bt, bw, bb - bt);
  g.fillStyle = '#7b7266'; g.fillRect(bx, bb - 40, bw, 40);
  g.fillStyle = '#5b6448'; g.fillRect(bx - 18, bt - 20, bw + 36, 26); // roof
  g.fillStyle = '#434a35'; g.fillRect(bx - 18, bt + 4, bw + 36, 6);
  // lit window
  gr = g.createLinearGradient(0, 1240, 0, 1340);
  gr.addColorStop(0, '#ffe2a6'); gr.addColorStop(1, '#f2b46a');
  g.fillStyle = '#4b4438'; g.fillRect(bx + 26, 1236, 120, 104);
  g.fillStyle = gr; g.fillRect(bx + 32, 1242, 108, 92);
  g.fillStyle = '#4b4438'; g.fillRect(bx + 84, 1242, 5, 92);
  gr = g.createRadialGradient(bx + 86, 1290, 10, bx + 86, 1290, 200);
  gr.addColorStop(0, 'rgba(255,210,140,.45)'); gr.addColorStop(1, 'rgba(255,210,140,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(bx + 86, 1290, 200, 0, 7); g.fill();
  g.fillStyle = '#6a6153'; g.fillRect(bx + 160, 1250, 54, 165); // door
  // sign board on the roof
  g.fillStyle = '#2f3a2c'; g.fillRect(bx + 20, 1120, 8, 50); g.fillRect(bx + bw - 28, 1120, 8, 50);
  g.fillStyle = '#26402f'; rr(g, bx - 70, 1050, bw + 140, 86, 10); g.fill();
  g.strokeStyle = '#e8e3d0'; g.lineWidth = 4; rr(g, bx - 62, 1058, bw + 124, 70, 7); g.stroke();
  g.fillStyle = '#f2eedf'; g.font = '800 44px Vazir'; g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('ایست بازرسی مرزی', bx + bw / 2, 1096);
  // raised barrier boom
  g.fillStyle = '#3a3b3f'; g.fillRect(722, 1330, 26, 130);
  g.save(); g.translate(735, 1340); g.rotate(-1.18);
  for (let i = 0; i < 9; i++) { g.fillStyle = i % 2 ? '#f1ece2' : '#c3352b'; g.fillRect(i * 52, -9, 52, 18); }
  g.restore();
  // painted border line across the road (perspective band)
  g.save();
  g.beginPath(); g.moveTo(690, 1460); g.lineTo(716, 1460); g.lineTo(762, WY0 + WH); g.lineTo(650, WY0 + WH); g.closePath();
  g.fillStyle = 'rgba(232,198,64,.85)'; g.fill();
  g.beginPath(); g.moveTo(722, 1460); g.lineTo(730, 1460); g.lineTo(790, WY0 + WH); g.lineTo(772, WY0 + WH); g.closePath();
  g.fillStyle = 'rgba(240,236,226,.7)'; g.fill();
  g.restore();
}

function paintVillageProps(g, rnd) {
  // row of low houses behind the road
  const cols = ['#cdb79c', '#b89a7e', '#d5c6ad', '#a98f78', '#c4a98d', '#bfae99'];
  let x = WX0 - 20, i = 0;
  while (x < WX0 + WW) {
    const w = 190 + rnd() * 150, h = 220 + rnd() * 200, top = 1455 - h, col = cols[i % cols.length];
    let gr = g.createLinearGradient(x, 0, x + w, 0);
    gr.addColorStop(0, col); gr.addColorStop(1, mixHex(col, '#5c5048', .35));
    g.fillStyle = gr; g.fillRect(x, top, w, h);
    g.fillStyle = mixHex(col, '#3b332d', .45); g.fillRect(x - 6, top - 12, w + 12, 16);
    // windows, some lit
    for (let wy = top + 40; wy < 1455 - 110; wy += 110) for (let wx = x + 30; wx < x + w - 60; wx += 90) {
      const lit = rnd() < .55;
      g.fillStyle = '#4d4239'; g.fillRect(wx - 4, wy - 4, 58, 72);
      if (lit) { const lg = g.createLinearGradient(0, wy, 0, wy + 64); lg.addColorStop(0, '#ffe1a0'); lg.addColorStop(1, '#eca95e'); g.fillStyle = lg; }
      else g.fillStyle = '#6b6f78';
      g.fillRect(wx, wy, 50, 64);
      if (lit) { const gl = g.createRadialGradient(wx + 25, wy + 32, 5, wx + 25, wy + 32, 120); gl.addColorStop(0, 'rgba(255,205,140,.3)'); gl.addColorStop(1, 'rgba(255,205,140,0)'); g.fillStyle = gl; g.fillRect(wx - 100, wy - 90, 250, 250); }
    }
    if (i % 3 === 1) { // little shop with awning
      g.fillStyle = '#3d342c'; g.fillRect(x + 30, 1455 - 150, w - 60, 150);
      const lg = g.createLinearGradient(0, 1305, 0, 1455); lg.addColorStop(0, '#ffd99a'); lg.addColorStop(1, '#d89050');
      g.fillStyle = lg; g.fillRect(x + 40, 1455 - 140, w - 80, 140);
      for (let k = 0; k < (w - 40) / 30; k++) { g.fillStyle = k % 2 ? '#e8e0cc' : '#8b3b2f'; g.beginPath(); g.moveTo(x + 20 + k * 30, 1455 - 175); g.lineTo(x + 50 + k * 30, 1455 - 175); g.lineTo(x + 56 + k * 30, 1455 - 140); g.lineTo(x + 26 + k * 30, 1455 - 140); g.fill(); }
    } else {
      g.fillStyle = '#5a4434'; g.fillRect(x + w / 2 - 30, 1455 - 120, 60, 120);
    }
    x += w + 10 + rnd() * 30; i++;
  }
  for (let k = 0; k < 30; k++) {
    const bx = WX0 + rnd() * WW, r = 12 + rnd() * 20;
    g.fillStyle = `rgba(${50 + rnd() * 20 | 0},${66 + rnd() * 25 | 0},${44 + rnd() * 15 | 0},.9)`;
    g.beginPath(); g.arc(bx, 1450, r, Math.PI, 0); g.fill();
  }
  lamp(g, 420, 1452, 1060);
  // soft fog veil over the houses
  const gr = g.createLinearGradient(0, 1000, 0, 1460);
  gr.addColorStop(0, 'rgba(232,212,200,.35)'); gr.addColorStop(1, 'rgba(232,212,200,.05)');
  g.fillStyle = gr; g.fillRect(WX0, 1000, WW, 460);
}

function paintBackground(kind) {
  const c = mk(WW * BS, WH * BS), g = c.getContext('2d');
  g.scale(BS, BS); g.translate(-WX0, -WY0);
  const rnd = mulberry(kind === 'border' ? 42 : 99);
  paintSkyAndLand(g, rnd);
  paintRoad(g, rnd);
  if (kind === 'border') paintBorderProps(g, rnd); else paintVillageProps(g, rnd);
  return c;
}

function loadImg(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; }); }

// fog texture (wraps horizontally), dust, grain, vignette
let FOG, GRAIN = [], VIGN;
function paintFx() {
  FOG = mk(1620, 600); const g = FOG.getContext('2d'); const rnd = mulberry(5);
  g.filter = 'blur(30px)';
  for (let i = 0; i < 60; i++) {
    const x = rnd() * 1620, y = 150 + rnd() * 300, rx = 120 + rnd() * 260, ry = 30 + rnd() * 60;
    g.fillStyle = `rgba(240,228,220,${.12 + rnd() * .2})`;
    for (const dx of [-1620, 0, 1620]) { g.beginPath(); g.ellipse(x + dx, y, rx, ry, 0, 0, 7); g.fill(); }
  }
  for (let k = 0; k < 4; k++) {
    const n = mk(540, 960), ng = n.getContext('2d'), id = ng.createImageData(540, 960), r2 = mulberry(100 + k);
    for (let p = 0; p < id.data.length; p += 4) { const v = r2() * 255; id.data[p] = id.data[p + 1] = id.data[p + 2] = v; id.data[p + 3] = 22; }
    ng.putImageData(id, 0, 0); GRAIN.push(n);
  }
  VIGN = mk(W, H); const vg = VIGN.getContext('2d');
  const gr = vg.createRadialGradient(W / 2, H * .48, H * .28, W / 2, H * .5, H * .78);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(10,8,14,.62)');
  vg.fillStyle = gr; vg.fillRect(0, 0, W, H);
}

// ------------------------------------------------------------ camera
function setCam(g, cx, cy, z, sx = 0, sy = 0) { g.setTransform(z, 0, 0, z, W / 2 - cx * z + sx, H / 2 - cy * z + sy); }
function drawBg(g, kind, t) {
  g.drawImage(BG[kind], WX0, WY0, WW, WH);
  // drifting fog behind actors
  const off = (t * 14) % 1620;
  g.globalAlpha = .55;
  g.drawImage(FOG, WX0 - off, 1050, 1620, 600); g.drawImage(FOG, WX0 - off + 1620, 1050, 1620, 600);
  g.globalAlpha = 1;
}
function frontFog(g, t) {
  const off = (t * 26) % 1620;
  g.globalAlpha = .22;
  g.drawImage(FOG, WX0 - off, 1560, 1620, 600); g.drawImage(FOG, WX0 - off + 1620, 1560, 1620, 600);
  g.globalAlpha = 1;
}

// ------------------------------------------------------------ characters
const LOOK = {
  man:   { coat: '#7b5b3a', coatD: '#5f4429', sweater: '#d9a23a', pants: '#2b2d33', shoe: '#5a3b25', hat: '#4f3a2a', scarf: '#9c3b2a' },
  guard: { coat: '#56653d', coatD: '#424f2d', sweater: '#56653d', pants: '#3e4a2e', shoe: '#1d1d1f', hat: '#46552f', belt: '#2a2420' },

  g.beginPath(); g.moveTo(x - w / 2, y); g.quadraticCurveTo(x - w * .15, y - h * 1.4, x, y - h); g.quadraticCurveTo(x + w * .15, y - h * 1.4 + 10, x + w / 2, y); g.closePath();
  const gr = g.createLinearGradient(0, y - h, 0, y); gr.addColorStop(0, '#e3c78d'); gr.addColorStop(1, '#b3935e');
  fillOut(g, gr, 4);
  g.fillStyle = 'rgba(120,90,50,.4)'; for (let i = 0; i < w / 4; i++) g.fillRect(x - w / 2 + hash(i) * w, y - hash(i + 50) * h * .8, 3, 3);
}
function drawSieve(g, x, y, r = 120) {
  g.save(); g.translate(x, y);
  g.beginPath(); g.ellipse(0, 0, r, r * .32, 0, 0, 7); g.fillStyle = 'rgba(220,190,130,.9)'; g.fill();
  g.save(); g.clip(); g.strokeStyle = 'rgba(80,70,50,.6)'; g.lineWidth = 2;
  for (let i = -r; i < r; i += 12) { g.beginPath(); g.moveTo(i, -r); g.lineTo(i, r); g.stroke(); g.beginPath(); g.moveTo(-r, i * .32); g.lineTo(r, i * .32); g.stroke(); }
  g.restore();
  g.beginPath(); g.ellipse(0, 0, r, r * .32, 0, 0, 7); g.lineWidth = 16; g.strokeStyle = OUT; g.stroke(); g.lineWidth = 10; g.strokeStyle = '#a7743f'; g.stroke();
  g.beginPath(); g.ellipse(0, 10, r, r * .32, 0, .1, Math.PI - .1); g.lineWidth = 14; g.strokeStyle = OUT; g.stroke(); g.lineWidth = 8; g.strokeStyle = '#8b5e31'; g.stroke();
  g.restore();
}
function drawMagnifier(g, x, y, ang) {
  g.save(); g.translate(x, y); g.rotate(ang);
  limb(g, [[0, 0], [0, 90]], 18, '#5a3a22');
  g.translate(0, -70);
  g.beginPath(); g.arc(0, 0, 66, 0, 7);
  const gr = g.createRadialGradient(-20, -20, 5, 0, 0, 66); gr.addColorStop(0, 'rgba(230,245,255,.55)'); gr.addColorStop(1, 'rgba(150,190,220,.25)');
  g.fillStyle = gr; g.fill(); g.lineWidth = 18; g.strokeStyle = OUT; g.stroke(); g.lineWidth = 11; g.strokeStyle = '#3b3d44'; g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 6; g.beginPath(); g.arc(0, 0, 44, Math.PI * 1.1, Math.PI * 1.45); g.stroke();
  g.restore();
}
function drawMoney(g, x, y, ang = 0, fan = 0) {
  g.save(); g.translate(x, y); g.rotate(ang);
  for (let i = 0; i < 3; i++) {
    g.save(); g.rotate((i - 1) * .25 * fan);
    rr(g, -56, -30, 112, 60, 6); fillOut(g, '#7fbf7a', 4);
    g.strokeStyle = '#3f7a43'; g.lineWidth = 3; rr(g, -46, -21, 92, 42, 4); g.stroke();
    g.beginPath(); g.arc(0, 0, 13, 0, 7); g.stroke();
    g.restore();
  }
  g.restore();
}
function musicNote(g, x, y, s, a) {
  g.save(); g.globalAlpha = a; g.translate(x, y); g.scale(s, s);
  g.fillStyle = '#fff'; g.strokeStyle = OUT; g.lineWidth = 4;
  g.beginPath(); g.ellipse(0, 0, 16, 12, -.4, 0, 7); g.fill(); g.stroke();
  g.fillRect(12, -60, 6, 60); g.strokeRect(12, -60, 6, 60);
  g.beginPath(); g.moveTo(18, -60); g.quadraticCurveTo(40, -48, 34, -24); g.lineWidth = 6; g.strokeStyle = '#fff'; g.stroke();
  g.restore();
}
function fly(g, x, y, t, i) {
  const a = t * 6 + i * 2, fx = x + Math.cos(a) * 60, fy = y + Math.sin(a * 1.7) * 30;
  g.fillStyle = OUT; g.beginPath(); g.arc(fx, fy, 6, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.7)'; const wv = Math.sin(t * 90) * 4;
  g.beginPath(); g.ellipse(fx - 5, fy - 8 - wv, 6, 4, -.5, 0, 7); g.ellipse(fx + 5, fy - 8 - wv, 6, 4, .5, 0, 7); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 1.5; g.setLineDash([4, 6]);
  g.beginPath(); g.arc(x, y, 60, a - 1, a - .2); g.stroke(); g.setLineDash([]);
}

// ------------------------------------------------------------ typography (screen space)
function popIn(t, a, b, dur = .35, out = .3) {
  if (t < a || t > b) return null;
  const pin = seg(t, a, a + dur), pout = seg(t, b - out, b);
  return { s: easeBack(pin) * (1 - .15 * pout), a: Math.min(clamp(pin * 2.5), 1 - pout) };
}
function title(g, text, x, y, size, st, opt = {}) {
  if (!st) return;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.translate(x, y); g.rotate(opt.rot || 0); g.scale(st.s, st.s); g.globalAlpha = st.a;
  g.font = `${opt.weight || 900} ${size}px Vazir`; g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round';
  g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 24; g.shadowOffsetY = 6;
  g.strokeStyle = opt.stroke || 'rgba(20,18,26,.9)'; g.lineWidth = size * .2; g.strokeText(text, 0, 0);
  g.shadowColor = 'transparent';
  g.fillStyle = opt.fill || '#ffffff'; g.fillText(text, 0, 0);
  g.restore();
}
function bubble(g, x, y, w, h, tail, lines, st) {
  if (!st) return;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = st.a;
  g.translate(tail[0], tail[1]); g.scale(st.s, st.s); g.translate(-tail[0], -tail[1]);
  g.shadowColor = 'rgba(0,0,0,.4)'; g.shadowBlur = 30; g.shadowOffsetY = 8;
  rr(g, x - w / 2, y - h / 2, w, h, 46); g.fillStyle = '#fff'; g.fill(); g.shadowColor = 'transparent';
  g.beginPath(); g.moveTo(x - 70, y + h / 2 - 4); g.lineTo(tail[0], tail[1]); g.lineTo(x - 10, y + h / 2 - 4); g.fill();
  g.lineWidth = 7; g.strokeStyle = OUT;
  g.beginPath(); g.moveTo(x - 10, y + h / 2); g.lineTo(tail[0], tail[1]); g.lineTo(x - 70, y + h / 2);
  g.arcTo(x - w / 2, y + h / 2, x - w / 2, y - h / 2, 46); g.arcTo(x - w / 2, y - h / 2, x + w / 2, y - h / 2, 46);
  g.arcTo(x + w / 2, y - h / 2, x + w / 2, y + h / 2, 46); g.arcTo(x + w / 2, y + h / 2, x - 10, y + h / 2, 46); g.closePath(); g.stroke();
  g.fillStyle = OUT; g.font = '900 60px Vazir'; g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach((l, i) => g.fillText(l, x, y + (i - (lines.length - 1) / 2) * 78));
  g.restore();
}
function tag(g, text, x, y, size, st, bg = '#ffd23f', fg = OUT, rot = 0) {
  if (!st) return;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.translate(x, y); g.rotate(rot); g.scale(st.s, st.s); g.globalAlpha = st.a;
  g.font = `900 ${size}px Vazir`; g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const w = g.measureText(text).width + size * .9, h = size * 1.45;
  g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 18; g.shadowOffsetY = 5;
  rr(g, -w / 2, -h / 2, w, h, h / 2); g.fillStyle = bg; g.fill(); g.shadowColor = 'transparent';
  g.lineWidth = 5; g.strokeStyle = OUT; g.stroke();
  g.fillStyle = fg; g.fillText(text, 0, size * .04);
  g.restore();
}
function stamp(g, text, x, y, size, st) {
  if (!st) return;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.translate(x, y); g.rotate(-.12);
  const s = st.s < 1 ? lerp(2.2, 1, easeOut(clamp(st.s))) : st.s; g.scale(s, s); g.globalAlpha = st.a;
  g.font = `900 ${size}px Vazir`; g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const w = g.measureText(text).width + 70, h = size * 1.6;
  g.fillStyle = 'rgba(255,255,255,.9)'; rr(g, -w / 2, -h / 2, w, h, 18); g.fill();
  g.lineWidth = 10; g.strokeStyle = '#2f8f47'; rr(g, -w / 2, -h / 2, w, h, 18); g.stroke();
  g.lineWidth = 3; rr(g, -w / 2 + 12, -h / 2 + 12, w - 24, h - 24, 10); g.stroke();
  g.fillStyle = '#2f8f47'; g.fillText(text, 0, 4);
  g.restore();
}
function calendar(g, t, t0, from, to, sceneEnd) {
  if (t < t0 || t > sceneEnd) return;
  const lt = t - t0;
  const enter = easeBack(seg(lt, 0, .35)), move = easeIO(seg(lt, 1.15, 1.6));
  const exitA = 1 - seg(t, sceneEnd - .25, sceneEnd);
  const cx = lerp(540, 175, move), cy = lerp(800, 330, move), sc = lerp(1, .42, move) * enter;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  if (move < 1) { g.fillStyle = `rgba(10,10,16,${.45 * (1 - move) * clamp(lt * 4)})`; g.fillRect(0, 0, W, H); }
  g.globalAlpha = exitA; g.translate(cx, cy); g.scale(sc, sc); g.rotate(-.04);
  const pw = 470, ph = 520;
  const page = (label, scaleY, shade) => {
    g.save(); g.translate(0, -ph / 2 + 120); g.scale(1, scaleY); g.translate(0, ph / 2 - 120);
    rr(g, -pw / 2, -ph / 2 + 120, pw, ph - 120, 22); g.fillStyle = '#fbf8f1'; g.fill(); g.lineWidth = 7; g.strokeStyle = OUT; g.stroke();
    if (scaleY > 0) {
      g.fillStyle = OUT; g.font = '900 104px Vazir'; g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(label, 0, 110);
      g.strokeStyle = 'rgba(0,0,0,.1)'; g.lineWidth = 3;
      for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(-170, 200 + i * 0); g.stroke(); }
    }
    if (shade) { g.fillStyle = `rgba(0,0,0,${shade})`; rr(g, -pw / 2, -ph / 2 + 120, pw, ph - 120, 22); g.fill(); }
    g.restore();
  };
  g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 40; g.shadowOffsetY = 14;
  rr(g, -pw / 2, -ph / 2, pw, ph, 24); g.fillStyle = '#fbf8f1'; g.fill(); g.shadowColor = 'transparent';
  page(to, 1, 0);
  const fp = seg(lt, .35, .85);
  if (fp < 1) page(from, Math.cos(fp * Math.PI), fp > .5 ? .25 : fp * .3);
  // header + rings
  rr(g, -pw / 2, -ph / 2, pw, 130, 24); g.fillStyle = '#c8392e'; g.fill(); g.lineWidth = 7; g.strokeStyle = OUT; g.stroke();
  g.fillStyle = '#fff'; g.font = '800 54px Vazir'; g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('تقویم', 0, -ph / 2 + 72);
  for (const rx of [-140, 140]) { rr(g, rx - 14, -ph / 2 - 30, 28, 64, 14); g.fillStyle = '#d9dade'; g.fill(); g.lineWidth = 5; g.stroke(); }
  g.restore();
}

// ------------------------------------------------------------ scenes
const BIKE_COL = { red: '#c0392b', blue: '#2e6fb5', black: '#2a2c33' };
const BIKE_HI = { red: '#e8705f', blue: '#6aa6e6', black: '#5d6170' };

function shake(t, amt) { return [Math.sin(t * 2.1) * amt + Math.sin(t * 5.3) * amt * .4, Math.cos(t * 1.7) * amt * .8]; }

// Inspection framing shared by month 1–3 and the flashback
const INS = { bikeX: 560, guardX: 300, manX: 945 };
function inspectionWorld(g, t, o) {
  // o: {bike, open, guardPose, manExpr, guardExpr, look, sieve, magnifier, pile, sackAlpha, colorAmt, noBike}
  const bike = { x: INS.bikeX, y: GY, color: o.bikeColor, highlight: o.bikeHi, sacks: o.sackAlpha ?? 1, open: o.open || 0, glow: o.glow || 0 };
  const an = bikeAnchors(bike);
  const G = { kind: 'guard', x: INS.guardX, y: GY, s: 1, face: 1, expr: o.guardExpr || 'stern', look: o.look || [0, 0], arms: {}, sweat: o.sweat, tilt: o.tilt || 0 };
  if (o.guardPose === 'reach') G.arms.front = { t: o.handT || [an.sackTop[0] - 10, an.sackTop[1] + 10] };
  if (o.guardPose === 'magnify') { G.arms.front = { t: [an.sackTop[0] - 40, an.sackTop[1] - 70] }; }
  if (o.guardPose === 'sieve') { const sx = o.sieveX; G.arms.front = { t: [sx + 95, o.sieveY + 4] }; G.arms.back = { t: [sx - 100, o.sieveY + 4], bend: 1 }; }
  const M = { kind: 'man', x: INS.manX, y: GY, s: 1, face: -1, expr: o.manExpr || 'neutral', look: o.manLook || [0, 0], arms: o.manArms || {} };
  if (o.pile) sandPile(g, INS.guardX + 120, GY + 6, 170 + o.pile * 120, o.pile * 70);
  drawPerson(g, G, 'body');
  if (o.guardPose === 'sieve') {
    drawPerson(g, G, 'front');
    const sx = o.sieveX, sy = o.sieveY;
    sandStream(g, sx, sy + 20, GY, 150, t, 1.6, 70, 3);
    drawSieve(g, sx, sy);
  }
  if (!o.noBike) drawBike(g, bike);
  if (o.guardPose === 'reach' || o.guardPose === 'magnify' || !o.guardPose) {
    g.save(); g.beginPath(); g.rect(WX0, WY0, WW, an.sackOpenY - WY0 - 4); g.clip();
    drawPerson(g, G, 'front'); g.restore();
  }
  if (o.guardPose === 'magnify') { const h = [an.sackTop[0] - 40, an.sackTop[1] - 70]; drawMagnifier(g, h[0] + 6, h[1] - 10, -.5 + Math.sin(t * 2.5) * .12); }
  if (o.trickle) sandStream(g, an.sackTop[0] - 30, an.sackTop[1] - 40, an.sackTop[1] + 20, 30, t, 1.2, 14, 8, o.trickle);
  drawPerson(g, M);
  return { bike, an, G, M };
}

    setCam(ctx, 580, lerp(1300, 1250, seg(t, 28, 31.3)), 1.15, sx, sy);
    drawBg(ctx, 'village', t);
    const bike = { x: 600 + easeIO(seg(t, 30.2, 31.3)) * 40, y: GY, color: BIKE_COL.black, highlight: BIKE_HI.black, sacks: 0 };
    const an = bikeAnchors(bike);
    drawSack(ctx, 215, GY - 46, 165, 92); drawSack(ctx, 180, GY - 40, 150, 80);
    const give = easeIO(seg(t, 28.4, 29.0)), take = easeIO(seg(t, 29.2, 29.7));
    const moneyX = lerp(lerp(800, 600, give), 470, take), moneyY = lerp(lerp(1330, 1250, give), 1150, take);
    const B = { kind: 'buyer', x: 830, y: GY, s: 1, face: -1, expr: 'happy',
      arms: { front: { t: [moneyX + (take > 0 ? 300 * take : 0), moneyY + 20 * take + 40 * take] }, back: { t: an.grip } } };
    if (take >= 1) B.arms.front = { a: [Math.PI / 2 + .1, Math.PI / 2] };
    const M = { kind: 'man', x: 360, y: GY, s: 1, face: 1, expr: t > 29.6 ? 'happy' : 'smile',
      arms: { front: { t: t > 28.9 ? [moneyX - 10, moneyY + 10] : [470, 1420] }, back: {} } };
    drawPerson(ctx, M, 'body');
    drawPerson(ctx, B, 'body');
    drawBike(ctx, bike);
    drawPerson(ctx, B, 'front');
    drawPerson(ctx, M, 'front');
    if (t > 28.3) drawMoney(ctx, moneyX, moneyY - 20, -.2, take);
    frontFog(ctx, t);
    stamp(ctx, 'فروخته شد!', 540, 520, 96, popIn(t, 29.7, 31.3, .35, .2));
  } },
  // 6 — flashback panels & reveal
  { a: 31.3, b: 39.1, draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // blurred dim backdrop
    ctx.save(); ctx.filter = 'blur(10px) brightness(.45) saturate(.6)';
    setCam(ctx, 540, 1100, 1.0);
    ctx.drawImage(BG.border, WX0, WY0, WW, WH);
    ctx.restore(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    const reveal = seg(t, 36.75, 37.1);
    const sackA = 1 - easeIO(seg(t, 33.7, 35.0));
    const cols = ['red', 'blue', 'black'], labels = ['دوچرخه ۱', 'دوچرخه ۲', 'دوچرخه ۳'];
    const zp = .56;
    for (let i = 0; i < 3; i++) {
      const ent = easeOut(seg(t, 31.35 + i * .3, 31.95 + i * .3));
      if (ent <= 0) continue;
      const px = 60 + (1 - ent) * (i % 2 ? -1100 : 1100), py = 300 + i * 520, pw = 960, ph = 470;
      const pc = PANELS[i], pg = pc.getContext('2d');
      pg.setTransform(1, 0, 0, 1, 0, 0); pg.clearRect(0, 0, pw, ph);
      pg.setTransform(zp, 0, 0, zp, pw / 2 - 560 * zp, ph / 2 - 1360 * zp);
      pg.drawImage(BG.border, WX0 - 120, WY0, WW + 240, WH);
      const lt = t + i * 1.7;
      inspectionWorld(pg, lt, { bikeColor: BIKE_COL[cols[i]], open: 1, guardPose: 'reach', guardExpr: 'focused', look: [2, 6],
        handT: (() => { const a = bikeAnchors({ x: INS.bikeX, y: GY }); return [a.sackTop[0] - 10 + Math.sin(lt * 6) * 10, a.sackTop[1] + 40]; })(),
        manExpr: 'smirk', noBike: true });
      // frame + sepia
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 30;
      ctx.fillStyle = '#f3ecdc'; ctx.fillRect(px - 14, py - 14, pw + 28, ph + 28); ctx.shadowColor = 'transparent';
      ctx.filter = `sepia(${lerp(.9, .55, reveal)}) brightness(${lerp(.95, .7, reveal)}) contrast(1.05)`;
      ctx.drawImage(pc, px, py);
      ctx.filter = 'none';
      // bike drawn on top in (gradually returning) colour
      ctx.beginPath(); ctx.rect(px, py, pw, ph); ctx.clip();
      ctx.setTransform(zp, 0, 0, zp, px + pw / 2 - 560 * zp, py + ph / 2 - 1360 * zp);
      const sep = '#8a6f50';
      const pulse = reveal > 0 ? (.75 + .25 * Math.sin((t - 36.75) * 8)) * reveal : 0;
      drawBike(ctx, { x: INS.bikeX, y: GY, color: reveal > 0 ? mixHex(sep, BIKE_COL[cols[i]], reveal) : sep, highlight: reveal > .5 ? BIKE_HI[cols[i]] : null,
        sacks: sackA, open: 1, sackTint: '#a8916c', glow: pulse, glowColor: '#ffe27a' });
      ctx.restore();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      // film scratches on the old footage
      ctx.save(); ctx.globalAlpha = .25 * (1 - reveal); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      const sxp = px + ((t * 997 + i * 300) % pw); ctx.beginPath(); ctx.moveTo(sxp, py); ctx.lineTo(sxp + 6, py + ph); ctx.stroke(); ctx.restore();
      tag(ctx, labels[i], px + 150, py + ph / 2 + 40, 56, popIn(t, 36.85 + i * .15, 39.1, .3, .2), '#ffd23f', OUT, (i - 1) * .04);
    }
  } },
  // 7 — punchline: the guard is still sieving
  { a: 39.1, b: 43.0, draw(t) {
    const [sx, sy] = shake(t, 2.5);
    setCam(ctx, 560, lerp(1320, 1280, seg(t, 39.1, 43)), lerp(1.12, 1.2, seg(t, 39.1, 43)), sx, sy);
    drawBg(ctx, 'border', t);
    sandPile(ctx, 560, GY + 6, 380, 120);
    sandPile(ctx, 820, GY + 10, 200, 50);
    const G = { kind: 'guard', x: 420, y: GY, s: 1, face: 1, expr: 'focused', look: [3, 8], sweat: t, arms: {} };
    const sxv = 560 + Math.sin(t * 30) * 14, syv = 1335;
    G.arms.front = { t: [sxv + 95, syv + 4] }; G.arms.back = { t: [sxv - 100, syv + 4] };
    drawPerson(ctx, G, 'body'); drawPerson(ctx, G, 'front');
    sandStream(ctx, sxv, syv + 20, GY - 40, 150, t, 1.6, 70, 3);
    drawSieve(ctx, sxv, syv);
    fly(ctx, 470, 1010, t, 0); fly(ctx, 520, 980, t + 1.3, 1);
    frontFog(ctx, t);
    title(ctx, 'گونی‌ها فقط حواس‌پرتی بودن!', 540, 470, 74, popIn(t, 39.55, 43.5, .45, .1));
    const st = popIn(t, 39.9, 43.5, .4, .1);
    if (st) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = st.a; ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 12; ctx.lineCap = 'round';
      const p = easeOut(seg(t, 39.9, 40.5)); ctx.beginPath(); ctx.moveTo(880, 545); ctx.quadraticCurveTo(540, 575, lerp(880, 200, p), 545 + 10 * p); ctx.stroke(); ctx.restore(); }
  } },
];
let PANELS = [];

function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const sc = SCENES.find(s => t >= s.a && t < s.b) || SCENES[SCENES.length - 1];
  ctx.save(); sc.draw(t); ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1;
  // ambient dust motes
  for (let i = 0; i < 40; i++) {
    const x = (hash(i) * W + t * (8 + hash(i + 3) * 20)) % W, y = (hash(i + 7) * H + Math.sin(t * .5 + i) * 30);
    ctx.fillStyle = `rgba(255,240,220,${.1 + .15 * hash(i + 11)})`; ctx.beginPath(); ctx.arc(x, y, 1.5 + hash(i + 5) * 2.5, 0, 7); ctx.fill();
  }
  // warm grade + vignette + grain
  ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = 'rgba(255,190,140,.18)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(VIGN, 0, 0);
  ctx.globalCompositeOperation = 'overlay'; ctx.drawImage(GRAIN[Math.floor(t * 24) % 4], 0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
  // cut flashes (quick white dip) & fades
  for (const s of SCENES.slice(1)) { const d = Math.abs(t - s.a); if (d < .12) { ctx.fillStyle = `rgba(255,248,235,${(1 - d / .12) * .55})`; ctx.fillRect(0, 0, W, H); } }
  const fin = 1 - seg(t, 0, .5), fout = seg(t, 42.2, 43);
  if (fin > 0 || fout > 0) { ctx.fillStyle = `rgba(0,0,0,${Math.max(fin, fout)})`; ctx.fillRect(0, 0, W, H); }
}

async function init() {
  await document.fonts.load('900 40px Vazir'); await document.fonts.load('800 40px Vazir'); await document.fonts.load('700 40px Vazir');
  const [pb, pv] = await Promise.all([loadImg('assets/bg-border.jpg'), loadImg('assets/bg-village.jpg')]);
  BG.border = pb || paintBackground('border');
  BG.village = pv || paintBackground('village');
  paintFx();
  PANELS = [0, 1, 2].map(() => mk(960, 470));
  window.renderFrame = renderFrame; window.DURATION = DURATION; window.ready = true;
  const q = new URLSearchParams(location.search);
  if (q.has('t')) renderFrame(parseFloat(q.get('t')));
  else if (!q.has('static')) { const t0 = performance.now(); const loop = () => { renderFrame(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
}
init();
</script>
