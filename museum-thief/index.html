<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Painting Thief</title>
<style>
  @font-face { font-family: Lucky; src: url(assets/LuckiestGuy.woff2); }
  @font-face { font-family: Mont; font-weight: 800; src: url(assets/montserrat-latin-800-normal.woff2); }
  @font-face { font-family: Mont; font-weight: 900; src: url(assets/montserrat-latin-900-normal.woff2); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 540px; height: 960px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* «دزدِ تابلو» / "The Painting Thief" — motion graphic, 1080x1920, deterministic.
   window.renderFrame(t) draws the frame at time t (seconds).
   All on-screen text, captions and their timing live in TT / CAP_END below. */
const W = 1080, H = 1920, DURATION = 47.5;
const LANG = 'en', DIR = 'ltr';
function F(weight, size, kind = 'display') {
  return kind === 'display' ? `${Math.round(size * .92)}px Lucky` : `${weight} ${Math.round(size * .9)}px Mont`;
}
const TT = {
  title: 'THE PAINTING THIEF', cal: 'CALENDAR', day1: 'DAY 1', day2: 'DAY 2', day3: 'DAY 3',
  wet: ['WET', 'PAINT'], nothing: 'NOTHING!', exit: 'EXIT',
  guardQ: ['Where are you', 'taking that?'], manA: ["All done. Just", "packing up my stuff."],
  dirQ: ["Where's the", 'painting?!'], guardA: ['The painter took it…', "wasn't he done?"],
  end: ['EVERYONE CHECKED THE TOOLBOX.', 'NOBODY ASKED: WHO ARE YOU?'],
  // narration captions [start, text]; *word* = highlighted — timed to the ElevenLabs voice-over
  captions: [
    [0.5, 'Three days in a row, a man in work clothes came to the museum.'],
    [4.95, "He'd put up a *“Wet Paint”* sign and get to work."],
    [8.3, 'Every day as he left, the guard searched his *toolbox.*'],
    [13.9, 'He even unfolded the *rags…* but found nothing.'],
    [33.5, 'The museum had *never* hired a painter!'],
    [36.2, 'He spent three days there…'],
    [38.25, 'so that on day four, *no one* would be surprised to see him!'],
  ],
};
const CAP_END = [4.38, 7.77, 11.56, 17.07, 35.78, 37.94, 41.61];

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const OUT = '#1b1b1f';
const GY = 1760;              // ground line for characters (world y)

// ------------------------------------------------------------ utilities
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function vnoise(x, seed) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i + seed * 1000), hash(i + 1 + seed * 1000), u); }
function fbm(x, seed, oct = 5) { let s = 0, a = .5, f = 1; for (let o = 0; o < oct; o++) { s += a * vnoise(x * f, seed + o); a *= .5; f *= 2.03; } return s; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mixHex(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function fillOut(g, fill, lw = 5) { g.fillStyle = fill; g.fill(); g.lineWidth = lw; g.strokeStyle = OUT; g.lineJoin = 'round'; g.stroke(); }

let FOG, GRAIN = [], VIGN;
function paintFx() {
  FOG = mk(1620, 600); const g = FOG.getContext('2d'); const rnd = mulberry(5);
  g.filter = 'blur(30px)';
  for (let i = 0; i < 60; i++) {
    const x = rnd() * 1620, y = 150 + rnd() * 300, rx = 120 + rnd() * 260, ry = 30 + rnd() * 60;
    g.fillStyle = `rgba(240,228,220,${.12 + rnd() * .2})`;
    for (const dx of [-1620, 0, 1620]) { g.beginPath(); g.ellipse(x + dx, y, rx, ry, 0, 0, 7); g.fill(); }
  }
  for (let k = 0; k < 4; k++) {
    const n = mk(540, 960), ng = n.getContext('2d'), id = ng.createImageData(540, 960), r2 = mulberry(100 + k);
    for (let p = 0; p < id.data.length; p += 4) { const v = r2() * 255; id.data[p] = id.data[p + 1] = id.data[p + 2] = v; id.data[p + 3] = 22; }
    ng.putImageData(id, 0, 0); GRAIN.push(n);
  }
  VIGN = mk(W, H); const vg = VIGN.getContext('2d');
  const gr = vg.createRadialGradient(W / 2, H * .48, H * .28, W / 2, H * .5, H * .78);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(10,8,14,.62)');
  vg.fillStyle = gr; vg.fillRect(0, 0, W, H);
}


// ------------------------------------------------------------ characters
const LOOK = {
  worker:   { coat: '#3f6fa8', coatD: '#2f5583', arm: '#f1eee6', armD: '#d9d5cb', sweater: '#f1eee6', pants: '#3a659c', shoe: '#4a3a2c', hat: '#f2efe6' },
  guard:    { coat: '#26324a', coatD: '#1b2436', pants: '#1f2a3d', shoe: '#141416', hat: '#1f2a3f', belt: '#151515' },
  director: { coat: '#5b5f68', coatD: '#454850', sweater: '#f4f2ec', pants: '#4a4d55', shoe: '#2a2220', tie: '#b0302b', hair: '#2b2420' },
};

function limb(g, pts, w, col) {
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.strokeStyle = OUT; g.lineWidth = w + 10; g.stroke();
  g.strokeStyle = col; g.lineWidth = w; g.stroke();
}
function ik(sx, sy, tx, ty, l1, l2, bend) {
  const dx = tx - sx, dy = ty - sy;
  let d = Math.hypot(dx, dy); d = clamp(d, Math.abs(l1 - l2) + .01, l1 + l2 - .01);
  const a = Math.atan2(dy, dx), A = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  const ang = a + bend * A;
  const ex = sx + Math.cos(ang) * l1, ey = sy + Math.sin(ang) * l1;
  return [[sx, sy], [ex, ey], [sx + Math.cos(a) * d, sy + Math.sin(a) * d]];
}
function fk(sx, sy, a1, a2, l1, l2) {
  const ex = sx + Math.cos(a1) * l1, ey = sy + Math.sin(a1) * l1;
  return [[sx, sy], [ex, ey], [ex + Math.cos(a2) * l2, ey + Math.sin(a2) * l2]];
}

function drawHand(g, x, y, open, col = '#f6f5f1') {
  g.beginPath(); g.arc(x, y, open ? 25 : 21, 0, 7); fillOut(g, col, 5);
  if (open) { g.strokeStyle = OUT; g.lineWidth = 3; for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(x + i * 9, y - 6); g.lineTo(x + i * 9, y - 18); g.stroke(); } }
}

/* P: {kind,x,y,s,face, walk(phase|null), expr, look:[lx,ly], tilt, shrug, arms:{front,back}}
   arm spec: {t:[wx,wy]} world target, or {a:[a1,a2]} local angles, plus open:true for open palm.
   part: 'all' | 'body' (no front arm) | 'front' (only the front arm) */
const L1 = 140, L2 = 132;
function armPts(P, which, sh) {
  const spec = (P.arms || {})[which];
  const swing = P.walk != null ? Math.sin(P.walk) * .45 * (which === 'front' ? -1 : 1) : 0;
  if (spec && spec.t) {
    const lx = (spec.t[0] - P.x) / (P.s * P.face), ly = (spec.t[1] - P.y) / P.s;
    return ik(sh[0], sh[1], lx, ly, L1, L2, spec.bend ?? 1);
  }
  if (spec && spec.a) return fk(sh[0], sh[1], spec.a[0], spec.a[1], L1, L2);
  return fk(sh[0], sh[1], Math.PI / 2 + .12 + swing, Math.PI / 2 + .02 + swing * 1.3, L1, L2);
}

function drawPerson(g, P, part = 'all') {
  const C = LOOK[P.kind];
  g.save(); g.translate(P.x, P.y); g.scale(P.s * P.face, P.s);
  const bob = P.walk != null ? -Math.abs(Math.sin(P.walk)) * 10 : 0;
  const shr = (P.shrug || 0) * 22;
  if (part === 'head') { g.translate(0, -530 + bob - shr * .6 - 120); g.rotate(P.tilt || 0); drawHead(g, P, C); g.restore(); return; }
  const shF = [26, -520 + bob - shr], shB = [-22, -515 + bob - shr];
  if (part === 'front') {
    const a = armPts(P, 'front', shF);
    limb(g, a, 42, C.arm || C.coat); const sp = (P.arms || {}).front || {};
    if (!sp.noHand) drawHand(g, a[2][0], a[2][1], sp.open);
    g.restore(); return a[2];
  }
  // shadow
  g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(0, 4, 110, 18, 0, 0, 7); g.fill();
  // back arm
  const ab = armPts(P, 'back', shB);
  limb(g, ab, 40, C.armD || C.coatD); const bsp = (P.arms || {}).back || {};
  if (!bsp.noHand) drawHand(g, ab[2][0], ab[2][1], bsp.open, '#e9e8e3');
  // legs
  const hipY = -285 + bob;
  const legs = [];
  for (const side of [-1, 1]) {
    let th = Math.PI / 2, sn = Math.PI / 2;
    if (P.walk != null) { const ph = P.walk + (side > 0 ? 0 : Math.PI); th = Math.PI / 2 - Math.sin(ph) * .38; sn = th + Math.max(0, Math.cos(ph)) * .55; }
    legs.push({ side, pts: fk(side * 14, hipY, th, sn, 150, 140) });
  }
  legs.sort((a, b) => a.side - b.side);
  for (const L of legs) {
    limb(g, L.pts, 48, L.side < 0 ? mixHex(C.pants, '#000000', .25) : C.pants);
    const [ax, ay] = L.pts[2];
    g.save(); g.translate(ax, ay);
    g.beginPath(); g.moveTo(-20, -14); g.quadraticCurveTo(-24, 14, -10, 14); g.lineTo(52, 14); g.quadraticCurveTo(62, 10, 54, -2); g.quadraticCurveTo(30, -14, 12, -18); g.closePath();
    fillOut(g, C.shoe, 5); g.restore();
  }
  // torso
  const top = -530 + bob - shr * .6, hem = (P.kind === 'guard' || P.kind === 'worker') ? -268 + bob : -220 + bob;
  g.beginPath();
  g.moveTo(-58, top); g.lineTo(62, top); g.quadraticCurveTo(84, top + 8, 86, top + 50);
  g.lineTo(92, hem); g.quadraticCurveTo(0, hem + 10, -90, hem); g.lineTo(-80, top + 50); g.quadraticCurveTo(-78, top + 6, -58, top); g.closePath();
  g.save(); g.fillStyle = C.coat; g.fill(); g.clip();
  g.fillStyle = C.coatD; g.fillRect(-100, top - 10, 55, 400);               // back-side shading
  if (P.kind === 'worker') {                                                   // shirt + bib overalls with paint spots
    g.fillStyle = C.sweater; g.fillRect(-100, top - 10, 200, 70);
    g.fillStyle = C.coat; g.fillRect(-40, top + 40, 110, 300);
    g.strokeStyle = OUT; g.lineWidth = 4; g.strokeRect(-40, top + 40, 110, 300);
    g.fillStyle = C.coat; g.fillRect(-58, top - 6, 20, 60); g.fillRect(40, top - 6, 20, 60);
    g.fillStyle = '#e1e1e5'; g.beginPath(); g.arc(-48, top + 46, 7, 0, 7); g.arc(50, top + 46, 7, 0, 7); g.fill();
    rr(g, -10, top + 80, 60, 50, 6); g.stroke();
    for (const [x, y, c] of [[-60, 160, '#f0c22f'], [30, 210, '#d23b3b'], [60, 120, '#2fa35a'], [-20, 240, '#f0c22f'], [10, 150, '#ffffff']]) { g.fillStyle = c; g.beginPath(); g.arc(x, top + y, 7, 0, 7); g.fill(); }
  } else if (P.kind !== 'guard') {                                                    // open jacket / sweater front
    g.fillStyle = C.sweater; g.beginPath(); g.moveTo(18, top); g.lineTo(62, top); g.lineTo(70, hem); g.lineTo(26, hem); g.fill();
    g.strokeStyle = OUT; g.lineWidth = 4; g.beginPath(); g.moveTo(18, top + 10); g.lineTo(28, hem); g.stroke();
    if (P.kind === 'director') { g.beginPath(); g.moveTo(38, top + 4); g.lineTo(52, top + 4); g.lineTo(56, top + 150); g.lineTo(45, top + 170); g.lineTo(34, top + 150); g.closePath(); fillOut(g, C.tie, 3); }
    if (P.kind === 'man') { g.strokeStyle = 'rgba(0,0,0,.15)'; g.lineWidth = 3; for (let y = top + 30; y < hem; y += 18) { g.beginPath(); g.moveTo(22, y); g.lineTo(68, y); g.stroke(); } }
  } else {                                                                     // uniform: pockets, buttons, belt
    g.strokeStyle = OUT; g.lineWidth = 3;
    rr(g, 30, top + 60, 42, 40, 5); g.stroke(); rr(g, -40, top + 60, 42, 40, 5); g.stroke();
    g.fillStyle = '#d8b24a'; for (let y = top + 40; y < hem - 30; y += 52) { g.beginPath(); g.arc(18, y, 5, 0, 7); g.fill(); }
    g.fillStyle = C.belt; g.fillRect(-100, hem - 34, 200, 30);
    g.fillStyle = '#d8b24a'; g.fillRect(14, hem - 32, 26, 26);
    g.fillStyle = '#c33b2e'; g.fillRect(-70, top + 12, 34, 14);                // shoulder patch
  }
  g.restore();
  g.lineWidth = 5; g.strokeStyle = OUT; g.stroke();
  // neck + scarf
  g.fillStyle = '#f0efea'; g.fillRect(-16, top - 22, 34, 30);
  if (P.kind === 'man') {
    rr(g, -50, top - 18, 108, 36, 16); fillOut(g, C.scarf, 5);
    g.beginPath(); g.moveTo(30, top + 10); g.lineTo(54, top + 10); g.lineTo(58, top + 110); g.lineTo(34, top + 104); g.closePath(); fillOut(g, C.scarf, 5);
  }
  // head
  g.save(); g.translate(0, top - 120); g.rotate((P.tilt || 0));
  drawHead(g, P, C);
  g.restore();
  if (part === 'all') {
    const a = armPts(P, 'front', shF);
    limb(g, a, 42, C.arm || C.coat); const sp = (P.arms || {}).front || {};
    if (!sp.noHand) drawHand(g, a[2][0], a[2][1], sp.open);
  }
  g.restore();
}

function drawHead(g, P, C) {
  const R = 108;
  g.beginPath(); g.arc(0, 0, R, 0, 7);
  const hg = g.createRadialGradient(18, -25, 20, 0, 0, R);
  hg.addColorStop(0, '#fbfaf6'); hg.addColorStop(.75, '#f1efe9'); hg.addColorStop(1, '#d9d6cf');
  fillOut(g, hg, 6);
  const fx = 24, [lx, ly] = P.look || [0, 0];
  const e1 = [fx - 30, -6], e2 = [fx + 32, -6];
  const ex = P.expr || 'neutral';
  // blush
  g.fillStyle = 'rgba(214,150,150,.45)';
  g.beginPath(); g.ellipse(fx - 52, 30, 15, 9, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(fx + 56, 30, 15, 9, 0, 0, 7); g.fill();
  g.strokeStyle = OUT; g.fillStyle = OUT; g.lineCap = 'round'; g.lineWidth = 5;
  const line = (x1, y1, x2, y2) => { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
  const eye = (e, lid = 0, sx = 1) => {
    g.beginPath(); g.ellipse(e[0] + lx, e[1] + ly, 8 * sx, 11, 0, 0, 7); g.fill();
    if (lid > 0) { g.save(); g.fillStyle = '#f3f1ec'; g.fillRect(e[0] - 16, e[1] - 16, 32, 28 * lid); g.restore(); line(e[0] - 13, e[1] - 16 + 28 * lid, e[0] + 13, e[1] - 16 + 28 * lid); }
  };
  const arcEye = (e, up = true) => { g.beginPath(); if (up) g.arc(e[0], e[1] + 6, 11, Math.PI * 1.1, Math.PI * 1.9); else g.arc(e[0], e[1] - 6, 11, Math.PI * .1, Math.PI * .9); g.stroke(); };
  switch (ex) {
    case 'stern':
      eye(e1); eye(e2); line(e1[0] - 18, -42, e1[0] + 14, -32); line(e2[0] - 14, -32, e2[0] + 18, -42); line(fx - 8, 42, fx + 20, 42); break;
    case 'suspicious':
      eye(e1, .45); eye(e2, .3); line(e1[0] - 18, -36, e1[0] + 14, -30);
      g.beginPath(); g.moveTo(e2[0] - 16, -42); g.quadraticCurveTo(e2[0], -56, e2[0] + 18, -46); g.stroke();
      line(fx - 6, 44, fx + 22, 38); break;
    case 'smirk':
      eye(e1); eye(e2); line(e1[0] - 14, -38, e1[0] + 12, -40); line(e2[0] - 12, -40, e2[0] + 14, -38);
      g.beginPath(); g.moveTo(fx - 10, 40); g.quadraticCurveTo(fx + 10, 48, fx + 28, 30); g.stroke(); break;
    case 'smile':
      eye(e1); eye(e2); line(e1[0] - 14, -38, e1[0] + 12, -40); line(e2[0] - 12, -40, e2[0] + 14, -38);
      g.beginPath(); g.arc(fx + 4, 26, 20, .25, Math.PI - .25); g.stroke(); break;
    case 'happy':
      arcEye(e1); arcEye(e2);
      g.beginPath(); g.moveTo(fx - 18, 28); g.quadraticCurveTo(fx + 4, 70, fx + 28, 28); g.closePath(); g.fill();
      g.fillStyle = '#d9776f'; g.beginPath(); g.ellipse(fx + 5, 46, 10, 6, 0, 0, 7); g.fill(); break;
    case 'closed':
      arcEye(e1); arcEye(e2); g.beginPath(); g.arc(fx + 4, 26, 20, .25, Math.PI - .25); g.stroke(); break;
    case 'whistle':
      arcEye(e1); arcEye(e2); g.beginPath(); g.ellipse(fx + 14, 40, 7, 9, 0, 0, 7); g.stroke(); break;
    case 'focused':
      eye(e1, .35); eye(e2, .35); line(e1[0] - 18, -40, e1[0] + 14, -30); line(e2[0] - 14, -30, e2[0] + 18, -40);
      line(fx - 4, 44, fx + 18, 44); g.fillStyle = '#d9776f'; g.beginPath(); g.ellipse(fx + 22, 50, 7, 9, .4, 0, 7); g.fill(); g.strokeStyle = OUT; g.lineWidth = 3; g.stroke(); break;
    case 'tired':
      eye(e1, .55); eye(e2, .55); line(e1[0] - 16, -32, e1[0] + 12, -42); line(e2[0] - 12, -42, e2[0] + 16, -32);
      g.beginPath(); g.moveTo(fx - 12, 44); g.quadraticCurveTo(fx - 2, 36, fx + 6, 44); g.quadraticCurveTo(fx + 14, 52, fx + 24, 44); g.stroke(); break;
    case 'angry':
      eye(e1); eye(e2); g.lineWidth = 7; line(e1[0] - 18, -46, e1[0] + 14, -28); line(e2[0] - 14, -28, e2[0] + 18, -46); g.lineWidth = 5;
      g.beginPath(); g.ellipse(fx + 6, 46, 18, 11, 0, 0, 7); g.fill(); break;
    default:
      eye(e1); eye(e2); line(e1[0] - 14, -38, e1[0] + 12, -38); line(e2[0] - 12, -38, e2[0] + 14, -38); line(fx - 4, 42, fx + 16, 42);
  }
  if (P.kind === 'guard' || P.kind === 'director') { // moustache
    g.fillStyle = '#2b2622'; g.beginPath(); g.ellipse(fx - 2, 26, 18, 8, -.2, 0, 7); g.ellipse(fx + 22, 26, 18, 8, .2, 0, 7); g.fill();
  }
  if (P.sweat) {
    g.fillStyle = '#9fd3f2'; g.strokeStyle = OUT; g.lineWidth = 3;
    const sy = -60 + ((P.sweat * 60) % 40);
    g.beginPath(); g.moveTo(-70, sy - 22); g.quadraticCurveTo(-56, sy, -70, sy + 6); g.quadraticCurveTo(-84, sy, -70, sy - 22); g.fill(); g.stroke();
  }
  if (P.kind === 'director') { // glasses
    g.strokeStyle = OUT; g.lineWidth = 4; g.fillStyle = 'rgba(200,225,240,.25)';
    for (const ex of [fx - 30, fx + 32]) { g.beginPath(); g.arc(ex, -6, 22, 0, 7); g.fill(); g.stroke(); }
    g.beginPath(); g.moveTo(fx - 8, -8); g.lineTo(fx + 10, -8); g.stroke(); g.beginPath(); g.moveTo(fx - 52, -8); g.lineTo(-80, -14); g.stroke();
  }
  // hats / hair
  if (P.kind === 'worker') {
    g.beginPath(); g.moveTo(-104, -40); g.bezierCurveTo(-110, -150, 100, -150, 104, -50); g.quadraticCurveTo(0, -70, -104, -40); fillOut(g, C.hat, 6);
    g.beginPath(); g.moveTo(40, -62); g.quadraticCurveTo(140, -64, 150, -46); g.quadraticCurveTo(100, -38, 40, -46); fillOut(g, '#dcd8cc', 5);
    for (const [x, y, c] of [[-40, -100, '#2f7fd1'], [20, -112, '#d23b3b'], [60, -80, '#f0c22f']]) { g.fillStyle = c; g.beginPath(); g.arc(x, y, 7, 0, 7); g.fill(); }
  } else if (P.kind === 'guard') {
    rr(g, -100, -96, 204, 46, 8); fillOut(g, '#141c2c', 6);

  const eg = g.createRadialGradient((x0 + x1) / 2, top - 82, 5, (x0 + x1) / 2, top - 82, 140); eg.addColorStop(0, 'rgba(90,255,150,.25)'); eg.addColorStop(1, 'rgba(90,255,150,0)');
  g.fillStyle = eg; g.fillRect(x0 - 100, top - 220, 420, 260);
  g.fillStyle = '#f4fff6'; g.font = '900 36px Mont'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(TT.exit, (x0 + x1) / 2, top - 80);
  return c;
}

// ------------------------------------------------------------ props
function drawWetSign(g, x, base, open = 1, s = 1) {
  g.save(); g.translate(x, base); g.scale(s, s);
  const hw = lerp(16, 92, open), top = -270;
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(0, 4, hw + 30, 12, 0, 0, 7); g.fill();
  if (open > .05) { g.beginPath(); g.moveTo(-hw + 14, 0); g.lineTo(-10, top + 20); g.lineTo(10, top + 20); g.lineTo(hw - 14, 0); g.lineWidth = 10; g.strokeStyle = OUT; g.stroke(); g.lineWidth = 5; g.strokeStyle = '#c99a12'; g.stroke(); }
  g.beginPath(); g.moveTo(-hw, 0); g.lineTo(-hw * .55, top); g.lineTo(hw * .55, top); g.lineTo(hw, 0); g.closePath();
  const gr = g.createLinearGradient(0, top, 0, 0); gr.addColorStop(0, '#ffd83a'); gr.addColorStop(1, '#f1b90c');
  fillOut(g, gr, 6);
  if (open > .6) {
    g.globalAlpha = seg(open, .6, 1);
    g.fillStyle = OUT; g.font = '46px Lucky'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(TT.wet[0], 0, top + 70); g.fillText(TT.wet[1], 0, top + 120);
    g.beginPath(); g.moveTo(-26, top + 168); g.quadraticCurveTo(-26, top + 210, 0, top + 222); g.quadraticCurveTo(26, top + 210, 26, top + 168); g.quadraticCurveTo(0, top + 150, -26, top + 168);
    g.fillStyle = '#2b6fd6'; g.fill(); g.lineWidth = 4; g.strokeStyle = OUT; g.stroke();
    g.globalAlpha = 1;
  } else { g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(-hw * .3, top + 30, hw * .6, 200); }
  g.restore();
}

function drawToolbox(g, x, bottom, open = 0) {
  g.save(); g.translate(x, bottom);
  if (open > 0) { // brushes & rag sticking out
    const items = [['#d23b3b', -50, -.25], ['#2f7fd1', -18, .1], ['#2fa35a', 18, -.05], ['#f0c22f', 46, .3]];
    for (const [col, dx, a] of items) {
      g.save(); g.translate(dx, -70); g.rotate(a);
      limb(g, [[0, 0], [0, -70 * open]], 8, '#c79a5b');
      rr(g, -9, -70 * open - 34, 18, 36, 6); fillOut(g, '#b5b5ba', 4);
      g.beginPath(); g.moveTo(-9, -70 * open - 34); g.quadraticCurveTo(0, -70 * open - 62, 9, -70 * open - 34); g.closePath(); fillOut(g, col, 4);
      g.restore();
    }
    g.beginPath(); g.ellipse(-60, -78, 34, 18, -.3, 0, 7); fillOut(g, '#ece6d8', 4);
  }
  rr(g, -90, -80, 180, 80, 8); fillOut(g, '#c8382c', 6);
  g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(-88, -30, 176, 28);
  g.fillStyle = '#e1e1e5'; g.fillRect(-12, -72, 24, 14);
  if (open < .5) {
    rr(g, -94, -96, 188, 24, 6); fillOut(g, '#a82c22', 5);
    g.beginPath(); g.moveTo(-36, -96); g.quadraticCurveTo(-36, -136, 0, -136); g.quadraticCurveTo(36, -136, 36, -96); g.lineWidth = 16; g.strokeStyle = OUT; g.stroke(); g.lineWidth = 9; g.strokeStyle = '#2a2a2e'; g.stroke();
  } else {
    g.save(); g.translate(90, -80); g.rotate(.5); rr(g, 0, -12, 160, 24, 6); fillOut(g, '#a82c22', 5); g.restore();
  }
  g.restore();
}

function drawRag(g, x0, x1, y, unfold, t) {
  const w = lerp(60, x1 - x0, unfold), h = lerp(40, 170, unfold), cx = (x0 + x1) / 2;
  g.save();
  g.beginPath();
  g.moveTo(cx - w / 2, y);
  for (let i = 0; i <= 10; i++) g.lineTo(cx - w / 2 + w * i / 10, y + Math.sin(t * 9 + i) * 6 * unfold);
  for (let i = 10; i >= 0; i--) g.lineTo(cx - w / 2 + w * i / 10 + Math.sin(t * 7 + i) * 10 * unfold, y + h + Math.sin(t * 8 + i * 1.3) * 14 * unfold);
  g.closePath();
  g.fillStyle = '#efe9db'; g.fill(); g.save(); g.clip();
  const stains = [['#2f7fd1', .3, .4], ['#d23b3b', .7, .6], ['#2fa35a', .5, .8], ['#f0c22f', .2, .75]];
  for (const [col, u, v] of stains) { g.fillStyle = col; g.globalAlpha = .7; g.beginPath(); g.ellipse(cx - w / 2 + u * w, y + v * h, 18, 12, u * 3, 0, 7); g.fill(); }
  g.globalAlpha = 1; g.strokeStyle = 'rgba(0,0,0,.12)'; g.lineWidth = 3;
  for (let i = 1; i < 5; i++) { g.beginPath(); g.moveTo(cx - w / 2 + w * i / 5, y); g.lineTo(cx - w / 2 + w * i / 5 + 10, y + h); g.stroke(); }
  g.restore();
  g.lineWidth = 5; g.strokeStyle = OUT; g.stroke();
  g.restore();
}

function drawCanvasBack(g, x0, x1, top, base) {
  g.save();
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.moveTo(x0 + 40, top + 10); g.lineTo(x1 + 40, top + 10); g.lineTo(x1, base); g.lineTo(x0, base); g.fill();
  g.beginPath(); g.moveTo(x0 + 30, top); g.lineTo(x1 + 30, top); g.lineTo(x1, base); g.lineTo(x0, base); g.closePath();
  fillOut(g, '#e9dfc8', 6);
  g.save(); g.clip();
  g.strokeStyle = 'rgba(120,100,70,.18)'; g.lineWidth = 2; for (let x = x0; x < x1 + 40; x += 10) { g.beginPath(); g.moveTo(x, top); g.lineTo(x - 30, base); g.stroke(); }
  g.restore();
  const bar = (pts, w) => limb(g, pts, w, '#b8894f');
  bar([[x0 + 44, top + 14], [x1 + 16, top + 14]], 20); bar([[x0 + 14, base - 14], [x1 - 14, base - 14]], 20);
  bar([[x0 + 40, top + 14], [x0 + 12, base - 14]], 20); bar([[x1 + 18, top + 14], [x1 - 12, base - 14]], 20);
  bar([[(x0 + x1) / 2 + 30, top + 14], [(x0 + x1) / 2, base - 14]], 16); bar([[x0 + 30, (top + base) / 2], [x1 + 4, (top + base) / 2]], 16);
  g.restore();
}

function drawBrush(g, x, y, ang, tip = '#e8c75a') {
  g.save(); g.translate(x, y); g.rotate(ang);
  limb(g, [[0, 0], [0, -90]], 9, '#c79a5b');
  rr(g, -11, -128, 22, 40, 6); fillOut(g, '#b5b5ba', 4);
  g.beginPath(); g.moveTo(-11, -128); g.quadraticCurveTo(0, -164, 11, -128); g.closePath(); fillOut(g, tip, 4);
  g.restore();
}
function drawBench(g, x0, x1, top, base) {
  for (const lx of [x0 + 20, x1 - 40]) { g.fillStyle = '#2f2118'; g.fillRect(lx, top, 20, base - top); }
  rr(g, x0, top - 30, x1 - x0, 34, 8); fillOut(g, '#7a5233', 5);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse((x0 + x1) / 2, base + 4, (x1 - x0) / 2 + 20, 14, 0, 0, 7); g.fill();
}
function qmark(g, x, y, s, a) {
  g.save(); g.globalAlpha = a; g.translate(x, y); g.scale(s, s);
  g.font = '110px Lucky'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 14; g.strokeStyle = OUT; g.strokeText('?', 0, 0); g.fillStyle = '#ffd23f'; g.fillText('?', 0, 0);
  g.restore();
}
function musicNote(g, x, y, s, a) {
  g.save(); g.globalAlpha = a; g.translate(x, y); g.scale(s, s);
  g.fillStyle = '#fff'; g.strokeStyle = OUT; g.lineWidth = 4;
  g.beginPath(); g.ellipse(0, 0, 16, 12, -.4, 0, 7); g.fill(); g.stroke();
  g.fillRect(12, -60, 6, 60); g.strokeRect(12, -60, 6, 60);
  g.restore();
}

// ------------------------------------------------------------ helpers
function setCam(g, cx, cy, z, sx = 0, sy = 0) { g.setTransform(z, 0, 0, z, W / 2 - cx * z + sx, H / 2 - cy * z + sy); }
function shake(t, amt) { return [Math.sin(t * 2.1) * amt + Math.sin(t * 5.3) * amt * .4, Math.cos(t * 1.7) * amt * .8]; }
function toScreen(cam, x, y) { return [(x - cam[0]) * cam[2] + W / 2, (y - cam[1]) * cam[2] + H / 2]; }
const headY = GY - 650;
function bg(g) { g.drawImage(BG, WX0, WY0, WW, WH); }
function wallPainting(g) { drawFrame(g, PAINT.cx, PAINT.cy, PAINT.w, PAINT.h, ART); }

// ------------------------------------------------------------ scenes
const SCENES = [
  // 1 — day 1: worker arrives, puts up the sign; the guard watches
  { a: 0, b: 8, draw(t) {
    const cam = [600, lerp(1150, 1110, seg(t, 0, 8)), lerp(1.0, 1.05, easeIO(seg(t, 0, 8)))], [sx, sy] = shake(t, 2);
    setCam(ctx, cam[0], cam[1], cam[2], sx, sy); bg(ctx); wallPainting(ctx);
    const wp = easeOut(seg(t, .4, 3.6)), wx = lerp(1290, 900, wp), walking = t > .4 && t < 3.6;
    const putP = easeIO(seg(t, 4.0, 4.6)), openP = easeOut(seg(t, 4.5, 5.0));
    const bob = walking ? -Math.abs(Math.sin(t * 7.5)) * 10 : 0;
    const G = { kind: 'guard', x: 210, y: GY, s: 1, face: 1, expr: t > 3 ? 'suspicious' : 'neutral', look: [7, 0] };
    drawPerson(ctx, G);
    // the sign: carried folded, then set down & opened
    const handF = [wx - 70, GY - 470 + bob];
    if (putP > 0) drawWetSign(ctx, lerp(handF[0], SIGN_X, putP), lerp(handF[1] + 270, SIGN_Y, putP), openP);
    const M = { kind: 'worker', x: wx, y: GY, s: 1, face: -1, walk: walking ? t * 7.5 : null, expr: t > 5 ? 'smile' : 'neutral',
      arms: { back: { t: [wx + 14, GY - 430 + bob] }, front: putP < 1 ? { t: [lerp(handF[0], SIGN_X + 60, putP), lerp(handF[1], GY - 420, putP)] } : {} } };
    drawToolbox(ctx, wx + 14, GY - 330 + bob, 0);
    drawPerson(ctx, M);
    if (putP <= 0) drawWetSign(ctx, handF[0], handF[1] + 230, 0, .9);
    title(ctx, TT.title, 540, 300, 104, popIn(t, .3, 3.7, .5, .4));
  } },
  // 2 — day 2: canvas facing the wall, "painting" the panel
  { a: 8, b: 13, draw(t) {
    const [sx, sy] = shake(t, 2);
    setCam(ctx, lerp(560, 600, seg(t, 8, 13)), 1290, 1.3, sx, sy); bg(ctx); wallPainting(ctx);
    // fresh paint gloss on the panel
    const fresh = seg(t, 9.2, 12.8);
    ctx.fillStyle = `rgba(255,255,255,${.18 * fresh})`; ctx.fillRect(560, 1290, 140 * fresh + 10, 170);
    drawCanvasBack(ctx, 230, 500, 1150, 1716);
    drawWetSign(ctx, SIGN_X, SIGN_Y, 1);
    drawToolbox(ctx, 1010, 1718, 1);
    const wx = 760, ph = Math.sin(t * 7);
    const hand = [610 + ph * 28, 1380 + Math.cos(t * 7) * 26];
    const M = { kind: 'worker', x: wx, y: GY, s: 1, face: -1, expr: 'whistle', arms: { front: { t: hand } } };
    drawPerson(ctx, M);
    drawBrush(ctx, hand[0], hand[1], -1.2 + ph * .15, '#bfb198');
    for (let i = 0; i < 3; i++) { const p = ((t - 8) * .55 + i / 3) % 1; musicNote(ctx, wx + 80 + p * 70, 990 - p * 200, .9, Math.sin(p * Math.PI)); }
  } },
  // 3 — the toolbox search at the exit
  { a: 13, b: 18, draw(t) {
    const [sx, sy] = shake(t, 2);
    setCam(ctx, 930, 1300, 1.3, sx, sy); bg(ctx); wallPainting(ctx);
    drawWetSign(ctx, SIGN_X, SIGN_Y, 1);
    drawBench(ctx, 930, 1130, 1510, 1712);
    const open = seg(t, 13.5, 13.9);
    const reach = seg(t, 13.9, 14.4) * (1 - seg(t, 14.5, 15.0));
    const up = easeIO(seg(t, 14.5, 15.0)), unf = easeOut(seg(t, 15.1, 15.9));
    const G = { kind: 'guard', x: 1225, y: GY, s: 1, face: -1, expr: t > 16.2 ? 'tired' : 'suspicious', look: t < 15 ? [6, 8] : [4, 3], arms: {} };
    if (up > 0) { G.arms.front = { t: [lerp(1040, 1050, up), lerp(1420, 1255, up)] }; G.arms.back = { t: [lerp(1150, 1160, up), lerp(1340, 1260, up)] }; }
    else if (reach > 0) G.arms.front = { t: [lerp(1150, 1035, reach), lerp(1380, 1420, reach)] };
    drawToolbox(ctx, 1030, 1482, open);
    const W_ = { kind: 'worker', x: 700, y: GY, s: 1, face: 1, expr: t > 16.4 ? 'whistle' : 'smile' };
    drawPerson(ctx, W_);
    drawPerson(ctx, G);
    if (up > 0) drawRag(ctx, 1040, 1180, 1255, unf, t);
    if (t > 16.5) for (let i = 0; i < 2; i++) { const p = ((t - 16.5) * .6 + i / 2) % 1; musicNote(ctx, 780 + p * 60, 990 - p * 180, .9, Math.sin(p * Math.PI)); }
    title(ctx, TT.nothing, 560, 640, 120, popIn(t, 16.0, 17.9, .35, .3), { fill: '#ffd23f', rot: -.06 });
  } },
  // 4 — day 3: the painting leaves the wall… and the building
  { a: 18, b: 28, draw(t) {
    const look = easeIO(seg(t, 25.8, 26.3)) * (1 - easeIO(seg(t, 26.8, 27.3)));
    const cam = [lerp(620, 720, look), lerp(1160, 1240, look), lerp(1.0, 1.12, look)], [sx, sy] = shake(t, 2);
    setCam(ctx, cam[0], cam[1], cam[2], sx, sy); bg(ctx);
    drawWetSign(ctx, SIGN_X, SIGN_Y, 1);
    const lift = easeIO(seg(t, 19.0, 20.0));
    const walk1 = easeIO(seg(t, 20.0, 21.0)), walk2 = easeIO(seg(t, 27.0, 28.2));
    const wx = lerp(lerp(520, 640, walk1), 1300, walk2);
    const walking = (t > 20 && t < 21) || t > 27;
    const bob = walking ? -Math.abs(Math.sin(t * 7.5)) * 10 : 0;
    const pc = [lerp(PAINT.cx, wx + 40, lift), lerp(PAINT.cy, GY - 430 + bob, lift)];
    const hy = lerp(PAINT.cy + PAINT.h / 2 - 20, pc[1] + PAINT.h / 2 - 40, lift);
    const step = easeIO(seg(t, 26.6, 27.2));
    const G = { kind: 'guard', x: lerp(1000, 1180, step), y: GY, s: 1, face: -1, walk: t > 26.6 && t < 27.2 ? t * 8 : null,
      expr: t < 21 ? 'neutral' : (t < 25.8 ? 'suspicious' : (t < 26.6 ? 'focused' : 'smile')), look: look > .1 ? [9, 10] : [4, 0], arms: {} };
    const stop = easeBack(seg(t, 20.6, 21.0)) * (1 - seg(t, 25.6, 26.0));
    if (stop > 0) G.arms.front = { a: [lerp(Math.PI / 2 + .1, -.35, stop), lerp(Math.PI / 2, -1.1, stop)], open: stop > .5 };
    if (t > 26.8) G.arms.front = { a: [.5, .2], open: true };
    const M = { kind: 'worker', x: wx, y: GY, s: 1, face: 1, walk: walking ? t * 7.5 : null, expr: t > 23.3 && t < 25.9 ? 'smile' : (t > 26.6 ? 'happy' : 'neutral'),
      arms: { back: { t: [pc[0] - 90, hy] }, front: { t: [pc[0] + 70, hy] } } };
    drawPerson(ctx, G);
    if (lift <= 0) { wallPainting(ctx); drawPerson(ctx, M); }
    else { drawPerson(ctx, M, 'body'); drawFrame(ctx, pc[0], pc[1], PAINT.w, PAINT.h, ART); drawPerson(ctx, M, 'head'); drawPerson(ctx, M, 'front'); }
    const gh = toScreen(cam, G.x, headY), mh = toScreen(cam, wx, headY);
    bubble(ctx, 560, 470, 860, 230, [gh[0] - 40, gh[1] - 140], TT.guardQ, popIn(t, 21.0, 23.3, .3, .2));
    bubble(ctx, 540, 470, 900, 230, [mh[0] + 20, mh[1] - 140], TT.manA, popIn(t, 23.4, 25.8, .3, .2));
  } },
  // 5 — the director finds the empty wall
  { a: 28, b: 33, draw(t) {
    const cam = [500, 1150, 1.05], [sx, sy] = shake(t, 2);
    setCam(ctx, cam[0], cam[1], cam[2], sx, sy); bg(ctx);
    drawWetSign(ctx, SIGN_X, SIGN_Y, 1);
    const dx = lerp(-220, 250, easeOut(seg(t, 28.0, 28.8)));
    const shr = Math.sin(seg(t, 30.8, 31.8) * Math.PI);
    const D = { kind: 'director', x: dx, y: GY, s: 1, face: 1, walk: t < 28.8 ? t * 8 : null, expr: t > 28.8 ? 'angry' : 'neutral', look: [3, -6], arms: {} };
    if (t > 28.9) D.arms.front = { a: [-.75, -.95], open: true };
    const G = { kind: 'guard', x: 690, y: GY, s: 1, face: -1, expr: t > 30.6 ? 'smile' : 'neutral', shrug: shr, sweat: t > 31 ? t : 0,
      arms: shr > .05 ? { front: { a: [Math.PI / 2 - .2, -.3 - shr * .4], open: true }, back: { a: [Math.PI / 2 + .2, Math.PI + .3 + shr * .4], open: true } } : {} };
    drawPerson(ctx, G); drawPerson(ctx, D);
    const dh = toScreen(cam, dx, headY), gh = toScreen(cam, 690, headY);
    bubble(ctx, 540, 470, 760, 230, [dh[0] + 40, dh[1] - 140], TT.dirQ, popIn(t, 28.7, 30.5, .3, .2));
    bubble(ctx, 540, 470, 860, 230, [gh[0] - 30, gh[1] - 140], TT.guardA, popIn(t, 30.6, 33.3, .3, .2));
  } },
  // 6 — the reveal: there never was a painter
  { a: 33, b: 41.9, draw(t) {
    const p = easeIO(seg(t, 33, 41.9));
    const cam = [lerp(500, 540, p), lerp(1150, 1080, p), lerp(1.05, 1.22, p)], [sx, sy] = shake(t, 2);
    setCam(ctx, cam[0], cam[1], cam[2], sx, sy); bg(ctx);
    drawWetSign(ctx, SIGN_X, SIGN_Y, 1);
    const fp = easeIO(seg(t, 33.3, 33.9));
    const D = { kind: 'director', x: 250, y: GY, s: 1, face: 1, expr: 'tired', arms: { front: fp > 0 ? { t: [lerp(330, 290, fp), lerp(1300, GY - 640, fp)], open: true } : {} } };
    const G = { kind: 'guard', x: 690, y: GY, s: 1, face: -1, expr: 'tired', look: [5, -8], sweat: t };
    drawPerson(ctx, G); drawPerson(ctx, D);
    for (let i = 0; i < 3; i++) {
      const st = seg(t, 33.4 + i * .35, 33.7 + i * .35);

  } },
  // 7 — final shot: the yellow sign beside the empty wall
  { a: 41.9, b: 48, draw(t) {
    const p = easeIO(seg(t, 41.9, 47.5));
    setCam(ctx, lerp(600, 610, p), lerp(1080, 1060, p), lerp(1.18, 1.26, p)); bg(ctx);
    drawWetSign(ctx, SIGN_X, SIGN_Y, 1);

    title(ctx, TT.end[1], 540, 395, 64, popIn(t, 44.05, 49, .45, .1), { maxW: 1000, fill: '#ffd23f' });

];

function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const sc = SCENES.find(s => t >= s.a && t < s.b) || SCENES[SCENES.length - 1];
  ctx.save(); sc.draw(t); ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // day markers
  tag(ctx, TT.day1, 175, 330, 52, popIn(t, 4.0, 7.95, .35, .2), '#fbf8f1', OUT, -.04);
  calendar(ctx, t, 8.0, TT.day1, TT.day2, 17.95);
  calendar(ctx, t, 18.0, TT.day2, TT.day3, 27.95);
  captions(ctx, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1;
  // dust motes in the spotlights
  for (let i = 0; i < 36; i++) {
    const x = (hash(i) * W + t * (6 + hash(i + 3) * 14)) % W, y = (hash(i + 7) * H * .7 + Math.sin(t * .5 + i) * 30);
    ctx.fillStyle = `rgba(255,240,215,${.08 + .12 * hash(i + 11)})`; ctx.beginPath(); ctx.arc(x, y, 1.5 + hash(i + 5) * 2.5, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = 'rgba(255,200,150,.16)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(VIGN, 0, 0);
  ctx.globalCompositeOperation = 'overlay'; ctx.drawImage(GRAIN[Math.floor(t * 24) % 4], 0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
  for (const s of SCENES.slice(1)) { const d = Math.abs(t - s.a); if (d < .12) { ctx.fillStyle = `rgba(255,248,235,${(1 - d / .12) * .5})`; ctx.fillRect(0, 0, W, H); } }
  const fin = 1 - seg(t, 0, .5), fout = seg(t, DURATION - .8, DURATION);
  if (fin > 0 || fout > 0) { ctx.fillStyle = `rgba(0,0,0,${Math.max(fin, fout)})`; ctx.fillRect(0, 0, W, H); }
}

const COVER_CFG = { t: 26.3, title: ['THE PAINTING', 'THIEF'], size: [140, 190], hook: ['WHERE IS HE GOING?', 330, 1330], target: [500, 1110], arrowEnd: [-40, 60], glow: 300, tagline: 'HE WALKED OUT IN BROAD DAYLIGHT' };
// ------------------------------------------------------------ Reels cover (?cover) — same look as the "Missing Nail" cover
function coverArrow(g, x0, y0, x1, y1) {
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.lineCap = 'round';
  for (const [w, c] of [[18, '#141418'], [10, '#ffd23f']]) {
    g.strokeStyle = c; g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1);
    const a = Math.atan2(y1 - y0, x1 - x0);
    g.moveTo(x1, y1); g.lineTo(x1 - Math.cos(a - .5) * 34, y1 - Math.sin(a - .5) * 34); g.moveTo(x1, y1); g.lineTo(x1 - Math.cos(a + .5) * 34, y1 - Math.sin(a + .5) * 34); g.stroke();
  }
  g.restore();
}
function renderCover() {
  const cfg = COVER_CFG, full = { s: 1, a: 1 };
  const keep = { title, tag, bubble, captions, calendar: typeof calendar === 'function' ? calendar : null };
  title = tag = bubble = captions = () => {}; if (keep.calendar) calendar = () => {};
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const sc = SCENES.find(s => cfg.t >= s.a && cfg.t < s.b);
  ctx.save(); sc.draw(cfg.t); ctx.restore();
  title = keep.title; tag = keep.tag; bubble = keep.bubble; captions = keep.captions; if (keep.calendar) calendar = keep.calendar;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1;
  // darken for legibility, then light the key detail
  ctx.fillStyle = 'rgba(8,10,20,.3)'; ctx.fillRect(0, 0, W, H);
  let gr = ctx.createLinearGradient(0, 0, 0, 760); gr.addColorStop(0, 'rgba(5,6,12,.65)'); gr.addColorStop(1, 'rgba(5,6,12,0)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, 760);
  const [tx, ty] = cfg.target;
  ctx.globalCompositeOperation = 'screen';
  gr = ctx.createRadialGradient(tx, ty, 10, tx, ty, cfg.glow || 330); gr.addColorStop(0, 'rgba(255,240,200,.55)'); gr.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(tx, ty, cfg.glow || 330, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  // hook + arrow, title, tagline
  coverArrow(ctx, cfg.hook[1], cfg.hook[2] + 50, tx + (cfg.arrowEnd || [0, 0])[0], ty + (cfg.arrowEnd || [0, 0])[1]);
  tag(ctx, cfg.hook[0], cfg.hook[1], cfg.hook[2], cfg.hookSize || 52, full, '#ffd23f', OUT, -.04);
  title(ctx, cfg.title[0], 540, 345, cfg.size[0], full, { maxW: 1020 });
  title(ctx, cfg.title[1], 540, 345 + cfg.size[0] * .55 + cfg.size[1] * .55, cfg.size[1], full, { maxW: 1020, fill: '#ffd23f' });
  tag(ctx, cfg.tagline, 540, 1560, 46, full, '#fbf8f1', OUT, .02);
  ctx.drawImage(VIGN, 0, 0);
  ctx.globalCompositeOperation = 'overlay'; ctx.drawImage(GRAIN[0], 0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
}

async function init() {
  await document.fonts.load('40px Lucky'); await document.fonts.load('900 40px Mont'); await document.fonts.load('800 40px Mont');
  ART = paintArt(432, 312, 11, { sky: ['#4a3f7a', '#c86a6a', '#f2b36b', '#f7d79a'], hills: ['#7a8f6a', '#4f6e4a', '#2f4a36'], river: '#9fd0e8' });
  SMALLART = paintArt(252, 312, 23, { sky: ['#1f3d5c', '#3f7ea6', '#a6d1d6'], hills: ['#c9a35a', '#8a6a3a', '#4a3a2a'], river: '#e8f4f8' });
  BG = paintMuseum();
  paintFx();
  window.renderFrame = renderFrame; window.DURATION = DURATION; window.ready = true;
  const q = new URLSearchParams(location.search);
  window.renderCover = renderCover;
  if (q.has('cover')) renderCover();
  else if (q.has('t')) renderFrame(parseFloat(q.get('t')));
  else if (!q.has('static')) { const t0 = performance.now(); const loop = () => { renderFrame(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
}
init();
</script>
